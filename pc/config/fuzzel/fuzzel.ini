font=IBM Plex Mono:size=12
dpi-aware=yes
terminal=foot -e
layer=overlay
prompt="❯ "
icon-theme=Papirus-Dark
lines=12
width=44
horizontal-pad=20
vertical-pad=12
inner-pad=6

# Плоско, как панель и окна: без скруглений, тонкая бледно-голубая рамка (#89b4fa на 60%,
# как у окна в фокусе), тёмный фон (под ним размытие — layer_rule blur-launcher),
# выбранная строка — бледно-голубая. Общий вид для Super+D, меню панели, питания, выбора окна.
[colors]
background=11111be6
text=cdd6f4ff
prompt=6c7086ff
placeholder=6c7086ff
match=89b4faff
selection=89b4fa26
selection-text=cdd6f4ff
selection-match=89b4faff
border=89b4fa99

[border]
width=1
radius=0
