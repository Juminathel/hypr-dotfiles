# networkmanager-dmenu 2.7.2 (github.com/firecat53/networkmanager-dmenu), скрипт в ~/.local/bin.
# Меню — fuzzel с общей темой ~/.config/fuzzel/fuzzel.ini; hypr-nmdm добавляет --output и --x-margin (центр под кликом).
[dmenu]
# --keyboard-focus=on-demand: при exclusive Hyprland отдаёт fuzzel клики по пустому месту (где нет окна),
# и fuzzel выбирал текущий пункт (24.11.2026: клик в пустоту выбирал «Wired connection»/«Output Devices»).
dmenu_command = fuzzel --keyboard-focus=on-demand --no-exit-on-keyboard-focus-loss --anchor=top-right --x-margin=12 --y-margin=42 --width=42 --lines=14
active_chars = 󰄬
compact = False
wifi_icons = 󰤯󰤟󰤢󰤥󰤨
format = {icon}  {name:<{max_len_name}}  {sec}
list_saved = False
prompt = Сеть

[dmenu_passphrase]
obscure = True
show_pass = foot --app-id=wifi-popup bash -c "nmcli device wifi show-password; read -n1 -p 'Любая клавиша…'"

[pinentry]
description = Пароль сети
prompt = Пароль:

[editor]
terminal = foot
gui_if_available = True
gui = nm-connection-editor

[nmdm]
rescan_delay = 4
notification_timeout = 4
show_notifications = True
