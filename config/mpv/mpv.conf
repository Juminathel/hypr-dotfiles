# субтитры крупнее по умолчанию (на ходу: Shift+G / Shift+F, сброс Ctrl+G)
sub-scale=1.3
# применять sub-scale в том числе к ASS-субтитрам
sub-ass-override=scale
# чтобы в маленьком окне субтитры не превращались в муравьёв
sub-ass-scale-with-window=yes
# аппаратное декодирование: без него 4K HEVC 10 bit декодирует процессор и видео тормозит.
# nvdec — NVIDIA, vaapi — встроенная AMD; что не подходит, mpv пропустит
hwdec=nvdec,vaapi,auto-safe
# не сыпать в терминал безвредное «Multiple Dolby Vision RPUs found in one AU»
msg-level=ffmpeg/video=error
# HDR/Dolby Vision: сводить в SDR самому mpv, а не отдавать PQ в Hyprland —
# иначе на весь экран Hyprland пытается пустить HDR напрямую на SDR-монитор и экран чёрный
target-colorspace-hint=no
