G add sub-scale +0.05
F add sub-scale -0.05
ctrl+g set sub-scale 1.0 ; show-text "sub-scale reset"
# заодно полезное:
r add sub-pos -1
R add sub-pos +1
v cycle sub-visibility

# --- размер окна ---
alt++ add window-scale +0.05
alt+- add window-scale -0.05
# Alt+0 / Alt+1 / Alt+2 = 50% / 100% / 200% (дефолтные бинды mpv)

# --- PiP тумблер ---
ctrl+p set window-scale 0.30 ; set border no  ; set ontop yes ; run "/home/alih/.local/bin/mpv-pip-hypr" "on" "${pid}" ; show-text "PiP on"
ctrl+P set window-scale 1.00 ; set border yes ; set ontop no ; run "/home/alih/.local/bin/mpv-pip-hypr" "off" "${pid}" ; show-text "PiP off"

# --- дорожки: аудио и субтитры ---
a      cycle audio        ; show-text "Аудио: ${audio} / ${track-list/count}"
ctrl+a cycle audio down
j      cycle sub          ; show-text "Субтитры: ${sid}"
J      cycle sub down

# --- дубли под русскую раскладку (mpv не транслирует layout) ---
ф cycle audio ; show-text "Аудио: ${audio}"
о cycle sub   ; show-text "Субтитры: ${sid}"
О cycle sub down
П add sub-scale +0.05
А add sub-scale -0.05
м cycle sub-visibility
к add sub-pos -1
К add sub-pos +1
ctrl+з set window-scale 0.30 ; set border no  ; set ontop yes ; run "/home/alih/.local/bin/mpv-pip-hypr" "on" "${pid}" ; show-text "PiP on"
