general {
    lock_cmd = pidof hyprlock || hyprlock          # не плодить копии блокировщика
    before_sleep_cmd = loginctl lock-session       # лочим ДО засыпания
    after_sleep_cmd = hyprctl dispatch dpms on     # будим экран после пробуждения
}

# 2.5 мин — приглушить подсветку
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10
    on-resume  = brightnessctl -r
}

# 5 мин — блокировка
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 6 мин — погасить экран
listener {
    timeout = 360
    on-timeout = hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on
}

