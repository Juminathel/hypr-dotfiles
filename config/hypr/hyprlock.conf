general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = /home/alih/Pictures/wallpapers/yofukashi-night.png
    blur_passes = 3
    blur_size = 8
    brightness = 0.6
}

input-field {
    monitor =
    size = 320, 50
    outline_thickness = 2
    dots_center = true
    outer_color = rgba(89b4faee)
    inner_color = rgba(1e1e2edd)
    font_color = rgb(cdd6f4)
    fail_color = rgba(f38ba8ee)
    placeholder_text = <span foreground="##6c7086">Пароль…  ($LAYOUT[EN,RU])</span>
    fail_text = <span foreground="##f38ba8">Неверно ($ATTEMPTS)</span>
    rounding = 10
    position = 0, -60
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(cdd6f4ff)
    font_size = 96
    font_family = IBM Plex Mono
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d %B')"
    color = rgba(a6adc8ff)
    font_size = 20
    font_family = IBM Plex Mono
    position = 0, 40
    halign = center
    valign = center
}

# Текущая раскладка под полем пароля; переключается Super+Space (xkb grp:win_space_toggle
# работает и на экране блокировки). $LAYOUT[EN,RU] — подписи для us и ru по порядку kb_layout.
label {
    monitor =
    text = 󰌌  $LAYOUT[EN,RU]
    color = rgba(89b4faff)
    font_size = 14
    font_family = IBM Plex Mono, JetBrainsMono Nerd Font
    position = 0, -115
    halign = center
    valign = center
}
