# Hyprland 0.53.x — общий конфиг (перенесён с ноутбука MSI, см. README.md)
# Всё, что зависит от компьютера (мониторы, видеокарта, правила столов), — в machine.conf.
# Полный список опций: https://wiki.hypr.land/Configuring/

################
### МОНИТОРЫ ###
################

# Мониторы — в machine.conf (у каждого компьютера свои).
source = ~/.config/hypr/machine.conf

# Переменная частота обновления: 2 = только для полноэкранных приложений
misc {
    vrr = 2
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    focus_on_activate = true
}

# Видеокарта (переменные драйвера) — в machine.conf.

# Тулкиты — нативный Wayland вместо XWayland
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
# Qt-программы берут шрифты, тему и значки из настроек Plasma (как в KDE): без этого
# Dolphin/Kate/Discover рисуются стандартным мелким шрифтом и не видят kdeglobals.
env = QT_QPA_PLATFORMTHEME,kde
env = GDK_BACKEND,wayland,x11
env = MOZ_ENABLE_WAYLAND,1
env = ELECTRON_OZONE_PLATFORM_HINT,wayland
env = SDL_VIDEODRIVER,wayland,x11
env = CLUTTER_BACKEND,wayland
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland

# Курсор
env = XCURSOR_THEME,Furina      # как в KDE (kcminputrc: cursorTheme=Furina, cursorSize=32)
env = XCURSOR_SIZE,32
env = HYPRCURSOR_THEME,Furina   # у Furina нет формата hyprcursor — Hyprland сам берёт XCursor
env = HYPRCURSOR_SIZE,32
# Курсор, который рисует сам Hyprland (над панелью waybar: GTK просит форму курсора по протоколу
# cursor-shape, и её берёт Hyprland из своей темы). env выше до его менеджера курсоров не доходит.
exec-once = hyprctl setcursor Furina 32
# меню приложений KDE: без него Dolphin/Discover не знают, чем открывать файлы (ksycoca пустой)
# XDG_MENU_PREFIX (меню программ для Dolphin) — в machine.conf: в Ubuntu plasma-, в Arch arch-.
# LibreOffice: в Hyprland сам выбирает старый вид «gen» (Windows 7, XWayland); kf6 — как в KDE
env = SAL_USE_VCLPLUGIN,kf6

####################
### ПРИЛОЖЕНИЯ   ###
####################

$terminal = foot
$fileManager = dolphin
$browser = firefox
$menu = fuzzel
$mainMod = SUPER

##################
### АВТОЗАПУСК ###
##################

# ПЕРВЫМ ДЕЛОМ: отдать окружение systemd и D-Bus, и только потом поднимать порталы.
# Если этого не сделать заранее, D-Bus попытается активировать xdg-desktop-portal-gtk
# без WAYLAND_DISPLAY, тот зависнет на 120 секунд, и всё это время flatpak-приложения
# (телеграм, firefox) будут ждать ответа портала при запуске.
# GTK-бэкенд портала падает вместе с прошлым сеансом (нет экрана) и висит в failed;
# try-restart его не поднимает, и новый xdg-desktop-portal 90 с ждёт его по D-Bus, а waybar
# на старте ждёт портал и выходит (21.10.2026 после перезахода Hyprland→Hyprland).
# Поэтому: сбросить failed и явно поднять gtk с уже новым WAYLAND_DISPLAY, потом фронтенд.
exec-once = sh -c 'dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE HYPRLAND_INSTANCE_SIGNATURE XDG_MENU_PREFIX; systemctl --user reset-failed xdg-desktop-portal-gtk.service; systemctl --user restart xdg-desktop-portal-gtk.service xdg-desktop-portal-hyprland.service; systemctl --user restart xdg-desktop-portal.service'

# путь агента у дистрибутивов разный: Ubuntu — libexec в x86_64-linux-gnu, Arch — /usr/lib
exec-once = sh -c 'for p in /usr/lib/x86_64-linux-gnu/libexec/polkit-kde-authentication-agent-1 /usr/lib/polkit-kde-authentication-agent-1 /usr/libexec/polkit-kde-authentication-agent-1; do [ -x "$p" ] && exec "$p"; done'
# Waybar рисует значки трея своей темой значков. Общий ~/.config/gtk-3.0/settings.ini
# принадлежит KDE и задаёт светлую breeze — её значки тёмные и сливаются с тёмной панелью.
# Поэтому waybar запускается с отдельным GTK-конфигом (~/.config/hypr/gtk), где breeze-dark.
# Настройки KDE при этом не трогаются вообще.
# Waybar выходит с ошибкой, если портал не ответил за 25 с (гонка при входе) — перезапускаем.
# hypr-respawn перезапускает только пока жив этот Hyprland, после выхода (в KDE) — завершается.
# GSETTINGS_BACKEND=keyfile: GTK на Wayland берёт курсор из GSettings, а при подменённом
# XDG_CONFIG_HOME база dconf пустая (Adwaita). Свои ключи — ~/.config/hypr/gtk/glib-2.0/settings/keyfile.
exec-once = $HOME/.local/bin/hypr-respawn env XDG_CONFIG_HOME=$HOME/.config/hypr/gtk GSETTINGS_BACKEND=keyfile waybar
# kded6 (его будят KDE-программы) забирает трей у waybar — сторож возвращает
exec-once = $HOME/.local/bin/hypr-respawn $HOME/.local/bin/hypr-tray-guard
# Значки в трее у Wine/Proton-программ (Wallpaper Engine) и старых X11 — по протоколу XEmbed,
# waybar его не понимает. xembedsniproxy (из KDE) переводит их в обычный трей.
exec-once = $HOME/.local/bin/hypr-respawn xembedsniproxy
# Всплывающие окна держатся запущенными, чтобы открываться без задержки (~/.local/bin/hypr_popup.py)
exec-once = $HOME/.local/bin/hypr-respawn $HOME/.local/bin/hypr-search --daemon
exec-once = $HOME/.local/bin/hypr-respawn $HOME/.local/bin/hypr-cliphist-pick --daemon
exec-once = $HOME/.local/bin/hypr-respawn $HOME/.local/bin/hypr-volume --daemon
exec-once = $HOME/.local/bin/hypr-respawn $HOME/.local/bin/hypr-wifi --daemon
# История буфера обмена (Super+V): cliphist пишет всё, что попадает в буфер.
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
# Рабочие столы без дыр: опустел 3-й — 4-й съезжает на его место (~/.local/bin/hypr-ws-compact).
exec-once = $HOME/.local/bin/hypr-respawn $HOME/.local/bin/hypr-ws-compact
# Панель Alt+Tab держится запущенной, чтобы появляться без задержки (~/.local/bin/hypr-alttab)
exec-once = $HOME/.local/bin/hypr-respawn $HOME/.local/bin/hypr-alttab daemon
exec-once = mako
# Обои — Waywallen (как в KDE). Демон из flatpak; если он остался от сеанса KDE,
# второй экземпляр просто выйдет. Картинку выводит waywallen-layer-shell
# (~/.local/bin, из релизов waywallen/waywallen-display, обновлять вручную).
# hypr-respawn: ждёт демон при старте и поднимает клиент, если тот упал.
# Откат на статичные обои: закомментировать две строки ниже и вернуть hyprpaper.
# На новом компьютере по умолчанию статичные обои (hyprpaper.conf). Живые — waywallen:
# поставить его (README, раздел «Живые обои»), раскомментировать две строки и убрать hyprpaper.
# exec-once = flatpak run --branch=stable --arch=x86_64 --command=waywallen org.waywallen.waywallen --no-ui
# exec-once = $HOME/.local/bin/hypr-respawn $HOME/.local/bin/waywallen-layer-shell
exec-once = hyprpaper
exec-once = hypridle
# nm-applet убран: дублировал значок сети в трее («Managed devices»). Wi-Fi — клик по значку сети на панели.
exec-once = blueman-applet
# udiskie убран (не нужен): флешки монтируются через файловый менеджер

#####################
### ВНЕШНИЙ ВИД   ###
#####################

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(89b4faee) rgba(cba6f7ee) 45deg
    col.inactive_border = rgba(45475aaa)
    resize_on_border = true
    # Разрешает tearing, но действует ТОЛЬКО на окна с правилом immediate (ниже).
    # Для всех остальных окон ничего не меняется.
    allow_tearing = true
    layout = dwindle
}

decoration {
    rounding = 8
    rounding_power = 2
    active_opacity = 1.0
    inactive_opacity = 0.95

    shadow {
        enabled = true
        range = 12
        render_power = 3
        color = rgba(00000055)
    }

    # Блюр на iGPU стоит недёшево. size/passes подобраны так,
    # чтобы не сажать батарею; если греется — поставь enabled = false
    blur {
        enabled = true
        size = 4
        passes = 2
        new_optimizations = true
        ignore_opacity = true
        xray = true
    }
}

animations {
    enabled = true
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear, 0, 0, 1, 1
    bezier = almostLinear, 0.5, 0.5, 0.75, 1
    bezier = quick, 0.15, 0, 0.1, 1

    animation = global,        1, 8,    default
    animation = border,        1, 5.39, easeOutQuint
    animation = windows,       1, 4,    easeOutQuint
    animation = windowsIn,     1, 3.5,  easeOutQuint, popin 87%
    animation = windowsOut,    1, 1.49, linear,       popin 87%
    animation = fade,          1, 3.03, quick
    animation = layers,        1, 3.81, easeOutQuint
    animation = workspaces,    1, 1.94, almostLinear, fade
}

binds {
    # По умолчанию 300 мс: после каждого щелчка колеса Hyprland игнорировал следующий —
    # отсюда пауза между столами при Super+колесо.
    scroll_event_delay = 0
}

dwindle {
    pseudotile = true
    preserve_split = true
    smart_split = false
    force_split = 2       # новое окно всегда справа/снизу (0 = по положению курсора)
}

master {
    new_status = master
}

#############
### ВВОД  ###
#############

# Мышь SIGMACHIP — те же настройки, что в KDE (kcminputrc): скорость -0.2, без ускорения.
# Остальные мыши и трэкпад в KDE на настройках по умолчанию — как и здесь.
device {
    name = sigmachip-usb-mouse
    sensitivity = -0.2
    accel_profile = flat
}

input {
    kb_layout = us,ru
    kb_options = grp:win_space_toggle,caps:escape
    numlock_by_default = true
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
        tap-to-click = true
        disable_while_typing = true
        scroll_factor = 0.5
    }
}

# Обзор рабочих столов hyprexpo: плагин подключается в machine.conf (в Arch — через hyprpm).

plugin {
    hyprexpo {
        columns = 2
        gap_size = 8
        bg_col = rgb(111111)
        workspace_method = first 1
        skip_empty = true
        gesture_distance = 300
    }
}

bind = $mainMod, G, exec, hyprctl dispatch hyprexpo:expo toggle   # плагин грузит hyprpm

# Жесты трэкпада (синтаксис 0.51+)
gesture = 3, horizontal, workspace              # 3 пальца влево/вправо — соседний рабочий стол
gesture = 4, horizontal, workspace              # то же 4 пальцами
# hyprexpo-gesture = 3, vertical, expo   (ключевое слово плагина; на ноутбуке с тачпадом — вернуть)           # 3 пальца вверх — обзор рабочих столов, вниз — закрыть (как GNOME)
gesture = 4, pinchin, close                     # щипок 4 пальцами — закрыть окно
gesture = 3, swipe, mod: SUPER, move            # Super + 3 пальца — двигать окно
gesture = 3, swipe, mod: SUPER ALT, resize      # Super+Alt + 3 пальца — менять размер

gestures {
    workspace_swipe_distance = 300
    workspace_swipe_cancel_ratio = 0.3
    workspace_swipe_create_new = true
    workspace_swipe_forever = false
}

###################
### КЛАВИАТУРА  ###
###################

bind = $mainMod, Return, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, B, exec, $browser
bind = $mainMod, D, exec, $menu
bind = ALT, Space, exec, $HOME/.local/bin/hypr-popup-show search   # быстрый поиск: программы, файлы, окна, калькулятор
bind = $mainMod SHIFT, V, togglefloating,   # было Super+V — отдано истории буфера
bind = $mainMod, V, exec, $HOME/.local/bin/hypr-popup-show cliphist   # история буфера с превью картинок
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, P, pseudo,
bind = $mainMod, T, togglesplit,      # было J — конфликтовало с movefocus вниз
bind = $mainMod SHIFT, M, exit,

# Меню питания: блокировка / выход / сон / перезагрузка / выключение
bind = $mainMod, Escape, exec, hypr-power
bind = $mainMod, slash, exec, hypr-help-toggle   # шпаргалка: открыть / закрыть
# Клик мимо шпаргалки или окон с панели закрывает их (~/.local/bin/hypr-popup-dismiss).
# bindn: клик не перехватывается, приложение получает его как обычно.
bindn = , mouse:272, exec, $HOME/.local/bin/hypr-popup-dismiss
# «Картинка в картинке» Firefox и mpv-pip таскаются обычной ЛКМ, без Super (~/.local/bin/hypr-pip-drag)
bindn = , mouse:272, exec, $HOME/.local/bin/hypr-pip-drag press
bindrn = , mouse:272, exec, $HOME/.local/bin/hypr-pip-drag release
bind = $mainMod SHIFT, Escape, exec, hyprlock   # было L — конфликтовало с movefocus вправо

# Фокус
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d
# Стрелки — переключение воркспейсов (фокус окон остаётся на hjkl)
bind = $mainMod, left,  workspace, m-1
bind = $mainMod, right, workspace, m+1
bind = $mainMod, up,    movefocus, u
bind = $mainMod, down,  movefocus, d
# перенести текущее окно на соседний воркспейс
bind = $mainMod SHIFT, left,  movetoworkspace, m-1
bind = $mainMod SHIFT, right, movetoworkspace, m+1

# Перемещение окна
bind = $mainMod SHIFT, h, movewindow, l
bind = $mainMod SHIFT, l, movewindow, r
bind = $mainMod SHIFT, k, movewindow, u
bind = $mainMod SHIFT, j, movewindow, d
# Окно на соседний монитор целиком, где бы оно ни стояло: влево — ноутбук, вправо — Acer
bind = $mainMod ALT, left,  movewindow, mon:l
bind = $mainMod ALT, right, movewindow, mon:r
bind = $mainMod ALT, h,     movewindow, mon:l
bind = $mainMod ALT, l,     movewindow, mon:r

# Размер
binde = $mainMod CTRL, h, resizeactive, -40 0
binde = $mainMod CTRL, l, resizeactive, 40 0
binde = $mainMod CTRL, k, resizeactive, 0 -40
binde = $mainMod CTRL, j, resizeactive, 0 40

# Рабочие столы
# Правила столов (на каком мониторе какие) — в machine.conf.
bind = $mainMod, 1, exec, $HOME/.local/bin/hypr-ws go 1
bind = $mainMod, 2, exec, $HOME/.local/bin/hypr-ws go 2
bind = $mainMod, 3, exec, $HOME/.local/bin/hypr-ws go 3
bind = $mainMod, 4, exec, $HOME/.local/bin/hypr-ws go 4
bind = $mainMod, 5, exec, $HOME/.local/bin/hypr-ws go 5
bind = $mainMod, 6, exec, $HOME/.local/bin/hypr-ws go 6
bind = $mainMod, 7, exec, $HOME/.local/bin/hypr-ws go 7
bind = $mainMod, 8, exec, $HOME/.local/bin/hypr-ws go 8
bind = $mainMod, 9, exec, $HOME/.local/bin/hypr-ws go 9
bind = $mainMod, 0, exec, $HOME/.local/bin/hypr-ws go 10
bind = $mainMod SHIFT, 1, exec, $HOME/.local/bin/hypr-ws move 1
bind = $mainMod SHIFT, 2, exec, $HOME/.local/bin/hypr-ws move 2
bind = $mainMod SHIFT, 3, exec, $HOME/.local/bin/hypr-ws move 3
bind = $mainMod SHIFT, 4, exec, $HOME/.local/bin/hypr-ws move 4
bind = $mainMod SHIFT, 5, exec, $HOME/.local/bin/hypr-ws move 5
bind = $mainMod SHIFT, 6, exec, $HOME/.local/bin/hypr-ws move 6
bind = $mainMod SHIFT, 7, exec, $HOME/.local/bin/hypr-ws move 7
bind = $mainMod SHIFT, 8, exec, $HOME/.local/bin/hypr-ws move 8
bind = $mainMod SHIFT, 9, exec, $HOME/.local/bin/hypr-ws move 9
bind = $mainMod SHIFT, 0, exec, $HOME/.local/bin/hypr-ws move 10
# Новый пустой стол справа от текущего; если справа занято — остальные сдвигаются на +1
bind = $mainMod, N, exec, $HOME/.local/bin/hypr-ws-insert go          # просто перейти
bind = $mainMod SHIFT, N, exec, $HOME/.local/bin/hypr-ws-insert move  # унести туда активное окно
bind = $mainMod, mouse_down, workspace, m+1
bind = $mainMod, mouse_up,   workspace, m-1
# Win+Tab — панель как на Alt+Tab, но листаются рабочие столы (по недавности), а не окна
# (дальше — submap wintab ниже)
bind = $mainMod, TAB, exec, $HOME/.local/bin/hypr-alttab-ctl start-ws
bind = $mainMod SHIFT, TAB, exec, $HOME/.local/bin/hypr-alttab-ctl start-ws-prev

# --- ПЕРЕКЛЮЧЕНИЕ ОКОН (Alt+Tab) ---
# В Hyprland своего Alt+Tab нет, всё делается биндами.
# Важно: cyclenext ходит только внутри текущего воркспейса, а у тебя окна
# разложены по разным — поэтому основным сделан focuscurrentorlast,
# он единственный прыгает между воркспейсами (проверено).

# Мгновенное переключение на предыдущее окно, как привычный Alt+Tab
# Alt+Tab как в Windows (~/.local/bin/hypr-alttab): держишь Alt, Tab — следующее окно
# (по недавности, все столы и мониторы), Shift+Tab — назад, отпустил Alt — остался. Esc — отмена.
# Мышью: навёл — выбрал, щёлкнул — перешёл.
# В submap alttab переключает сам демон: два бинда на одну клавишу (submap + exec) не работали —
# после смены submap второй бинд уже не срабатывал. Бинды зовут sh-скрипт hypr-alttab-ctl
# (пишет слово в FIFO демона) — Python на каждое нажатие давал задержку ~40 мс.
bind = ALT, TAB, exec, $HOME/.local/bin/hypr-alttab-ctl start
bind = ALT SHIFT, TAB, exec, $HOME/.local/bin/hypr-alttab-ctl start-prev

# Список всех окон со всех воркспейсов через fuzzel
bind = ALT, grave, exec, hypr-switch

# Перебор окон внутри текущего воркспейса
bind = ALT CTRL, TAB, cyclenext
bind = ALT CTRL, TAB, alterzorder, top
bind = ALT CTRL SHIFT, TAB, cyclenext, prev
bind = ALT CTRL SHIFT, TAB, alterzorder, top

submap = alttab
bind = ALT, TAB, exec, $HOME/.local/bin/hypr-alttab-ctl next
bind = ALT SHIFT, TAB, exec, $HOME/.local/bin/hypr-alttab-ctl prev
# отпустили Alt — выбор сделан (оба варианта: с модификатором и без, на случай разного порядка событий)
bindrt = ALT, Alt_L, exec, $HOME/.local/bin/hypr-alttab-ctl end
bindrt = ALT, Alt_L, submap, reset
bindr = , Alt_L, exec, $HOME/.local/bin/hypr-alttab-ctl end
bindr = , Alt_L, submap, reset
bindrt = ALT, Alt_R, exec, $HOME/.local/bin/hypr-alttab-ctl end
bindrt = ALT, Alt_R, submap, reset
bind = ALT, escape, exec, $HOME/.local/bin/hypr-alttab-ctl cancel
bind = ALT, escape, submap, reset
bind = , escape, exec, $HOME/.local/bin/hypr-alttab-ctl cancel
bind = , escape, submap, reset
submap = reset

# То же для Win+Tab (рабочие столы): листаем с зажатым Win, отпустили — перешли
submap = wintab
bind = SUPER, TAB, exec, $HOME/.local/bin/hypr-alttab-ctl next
bind = SUPER SHIFT, TAB, exec, $HOME/.local/bin/hypr-alttab-ctl prev
bindrt = SUPER, Super_L, exec, $HOME/.local/bin/hypr-alttab-ctl end
bindrt = SUPER, Super_L, submap, reset
bindr = , Super_L, exec, $HOME/.local/bin/hypr-alttab-ctl end
bindr = , Super_L, submap, reset
bindrt = SUPER, Super_R, exec, $HOME/.local/bin/hypr-alttab-ctl end
bindrt = SUPER, Super_R, submap, reset
bind = SUPER, escape, exec, $HOME/.local/bin/hypr-alttab-ctl cancel
bind = SUPER, escape, submap, reset
bind = , escape, exec, $HOME/.local/bin/hypr-alttab-ctl cancel
bind = , escape, submap, reset
submap = reset


# Мышь
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Скриншоты
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy
bind = SHIFT, Print, exec, grim - | wl-copy
bind = $mainMod, Print, exec, grim -g "$(slurp)" ~/Pictures/$(date +%Y-%m-%d_%H-%M-%S).png
# На клавиатуре ноутбука MSI клавиша с надписью PrtSc присылает Pause (keycode 127), а не Print
bind = , Pause, exec, grim -g "$(slurp)" - | wl-copy
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy   # как в Windows: область в буфер
bind = SHIFT, Pause, exec, grim - | wl-copy
bind = $mainMod, Pause, exec, grim -g "$(slurp)" ~/Pictures/$(date +%Y-%m-%d_%H-%M-%S).png
bind = $mainMod SHIFT, P, exec, hyprpicker -a
# btop как диспетчер задач в Windows; повторное нажатие закрывает
bind = CTRL SHIFT, Escape, exec, hyprctl clients | grep -q 'class: btop-popup' && hyprctl dispatch closewindow class:^btop-popup$ || foot --app-id=btop-popup -e btop

# Мультимедиа и яркость (bindel = работает при зажатии и на лок-скрине)
bindel = , XF86AudioRaiseVolume,  exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute,         exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioMicMute,      exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
# Яркость: brightnessctl пишет в sysfs и требует группы video, которой у тебя нет.
# hypr-brightness сам выберет рабочий путь (sysfs или logind по D-Bus).
bindel = , XF86MonBrightnessUp,   exec, hypr-brightness +5
bindel = , XF86MonBrightnessDown, exec, hypr-brightness -5
bindl  = , XF86AudioNext,  exec, playerctl next
bindl  = , XF86AudioPause, exec, playerctl play-pause
bindl  = , XF86AudioPlay,  exec, playerctl play-pause
bindl  = , XF86AudioPrev,  exec, playerctl previous

# Крышка ноутбука НАМЕРЕННО не обрабатывается здесь.
# Бинд `monitor eDP-1, disable` отключал единственный экран, и после пробуждения
# он не возвращался — ноут просыпался с чёрным экраном (проверено по журналу).
# Засыпанием при закрытии крышки занимается logind (HandleLidSwitch=suspend).
# Если появится внешний монитор — вернуть можно только через скрипт с проверкой,
# что монитор не один.

############################
### ПРАВИЛА ДЛЯ ОКОН     ###
############################
# Внимание: в 0.50+ старый синтаксис `windowrulev2 = ...` заменён
# на блочный `windowrule { match:... }`. Ниже — актуальный.

windowrule {
    # Окно-шпаргалка по Super+/ — плавающее, по центру
    name = hypr-help
    match:class = ^hypr-help$

    float = yes
    center = yes
    rounding = 12
}

windowrule {
    # История буфера Super+V (~/.local/bin/hypr-cliphist-pick) — плавающая, по центру
    name = cliphist-picker
    match:class = ^(hypr-cliphist|Hypr-cliphist)$
    float = yes
    size = 600 720
    rounding = 12
}

windowrule {
    # Выбор Wi-Fi (nmtui) по клику на значок сети в панели
    name = wifi-popup
    match:class = ^wifi-popup$
    float = yes
    center = yes
    size = 700 560
    rounding = 12
}

windowrule {
    # Окна громкости и Wi-Fi по клику на значки панели; позицию задаёт hypr-panel-popup
    name = volume-popup
    match:class = ^(hypr-volume|Hypr-volume|hypr-wifi|Hypr-wifi)$
    float = yes
    rounding = 12
}

windowrule {
    # Постоянные всплывающие окна (~/.local/bin/hypr_popup.py): живут спрятанными на скрытом
    # столе и по вызову переезжают на текущий — поэтому появляются сразу. Без анимации:
    # иначе окно «выплывает» ~0.35 с.
    name = resident-popups
    match:class = ^(hypr-search|hypr-cliphist|hypr-volume|hypr-wifi)$
    workspace = special:hypr-popups silent
    no_anim = yes
}

windowrule {
    # Быстрый поиск Alt+Space (hypr-search); позицию задаёт сам скрипт
    name = hypr-search
    match:class = ^hypr-search$
    float = yes
    # окно прозрачное, рамку и скругление рисует сам скрипт вокруг видимой панели
    rounding = 0
    border_size = 0
    no_shadow = yes
    no_blur = yes
}

windowrule {
    # Настройки сети KDE по ПКМ на значке сети в панели
    name = kde-network-popup
    match:class = ^kcm_networkmanagement$
    float = yes
    center = yes
    size = 1000 680
}

windowrule {
    # Панель Alt+Tab (~/.local/bin/hypr-alttab): по центру, поверх всего, без фокуса при
    # появлении. no_focus НЕ ставить: с ним Hyprland не отдаёт панели мышь (выбор щелчком).
    # Tab/отпускание Alt ловят бинды Hyprland, им всё равно, на ком фокус.
    name = alttab-overlay
    match:class = ^(hypr-alttab|Hypr-alttab)$
    float = yes
    center = yes
    pin = yes
    no_initial_focus = true
    no_anim = true
    # без тени и размытия: при закрытии панель на миг становится прозрачной (чтобы не «висела»,
    # пока Hyprland её гасит), и они остались бы пустым прямоугольником
    no_shadow = true
    no_blur = true
    border_size = 0
    rounding = 14
    opacity = 1.0 override 1.0 override
}

windowrule {
    # btop по клику на RAM в панели — плавающее окно по центру, закрывается кликом мимо
    name = btop-popup
    match:class = ^btop-popup$
    float = yes
    center = yes
    size = 1100 650
    rounding = 12
}

windowrule {
    # Telegram не перехватывает фокус: при новом сообщении он просит «активировать» окно,
    # а с focus_on_activate = true Hyprland переключал на него стол. Теперь только уведомление.
    name = telegram-no-steal-focus
    match:class = ^(org.telegram.desktop|TelegramDesktop)$
    suppress_event = activate activatefocus
}

windowrule {
    # JetBrains (PyCharm и др.): при открытом модальном диалоге (например Data Sources and Drivers)
    # стоит мыши зайти на главное окно — follow_mouse отдаёт ему фокус, IDE тут же просит
    # «активировать» диалог обратно, а с focus_on_activate = true Hyprland возвращал фокус и
    # дёргал курсор в центр диалога, и так по кругу. Запросы активации от IDE игнорируем.
    name = jetbrains-no-steal-focus
    match:class = ^jetbrains-.*$
    suppress_event = activate activatefocus
    # то же самое динамическим правилом — оно действует и на уже открытые окна
    focus_on_activate = false
}

windowrule {
    # Игнорировать запросы на разворот от приложений
    name = suppress-maximize
    match:class = .*
    suppress_event = maximize
}

windowrule {
    # Чинит проблемы с перетаскиванием в XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false
    no_focus = true
}

windowrule {
    # Системные диалоги KDE — плавающими по центру
    name = float-kde-dialogs
    match:class = ^(org.kde.polkit-kde-authentication-agent-1|pavucontrol|blueman-manager|nm-connection-editor|wdisplays|udiskie)$
    float = yes
    center = yes
}

windowrule {
    # Диалоги открытия/сохранения файлов
    name = float-file-dialogs
    match:title = ^(Open File|Save File|Открыть файл|Сохранить файл|Выберите файл)(.*)$
    float = yes
    center = yes
    size = 900 600
}

windowrule {
    # mpv-pip (~/.local/bin/mpv-pip): маленькое окно поверх всех в правом нижнем углу.
    # Ctrl+P в обычном mpv делает то же самое через mpv-pip-hypr.
    name = mpv-pip
    match:class = ^mpv-pip$
    float = yes
    pin = yes
    no_blur = true
    opacity = 1.0 override 1.0 override   # без прозрачности, даже когда окно не в фокусе
    keep_aspect_ratio = true
    size = 576 324
    move = monitor_w-window_w-16 monitor_h-window_h-16
}
windowrule {
    # Обычный mpv в режиме PiP (Ctrl+P → mpv-pip-hypr: плавающий + закреплён) — без прозрачности
    name = mpv-ctrlp-pip-opaque
    match:class = ^mpv$
    match:float = true
    match:pin = true
    opacity = 1.0 override 1.0 override
}
windowrule {
    # Picture-in-Picture поверх всех, без блюра
    name = pip-on-top
    match:title = ^(Picture-in-Picture|Картинка в картинке)$
    float = yes
    pin = yes
    no_blur = true
    opacity = 1.0 override 1.0 override   # без прозрачности, даже когда окно не в фокусе
    move = monitor_w-window_w-20 monitor_h-window_h-40
    size = 640 360
}

windowrule {
    # Главное окно клиента Steam (XWayland) Hyprland по умолчанию делает плавающим на весь
    # экран — оно живёт «само по себе», мимо тайлинга. Кладём его в сетку как обычное окно.
    # Список друзей, чаты и диалоги Steam сюда не попадают (у них другой заголовок).
    name = steam-client-tile
    match:class = ^steam$
    match:title = ^Steam$
    tile = yes
}

windowrule {
    # Список друзей Steam — узкое плавающее окно
    name = steam-friends-float
    match:class = ^steam$
    match:title = ^(Friends List|Список друзей)$
    float = yes
    size = 360 700
}

windowrule {
    # Игры Steam: без эффектов и с tearing — заметно ниже задержка ввода.
    # Если появятся горизонтальные разрывы картинки и будут мешать — убери immediate.
    name = steam-games
    match:class = ^(steam_app_\\d+|gamescope|steam_proton)$

    immediate = true
    no_blur = true
    no_anim = true
    rounding = 0
    border_size = 0
}

windowrule {
    # Wallpaper Engine (Steam, app 431960) — не игра, им только качают обои для waywallen.
    # Перебиваем правило steam-games выше: обычное окно в сетке, с рамкой и скруглением.
    name = wallpaper-engine-normal
    match:class = ^steam_app_431960$
    tile = yes
    immediate = false
    no_anim = false
    rounding = 8
    border_size = 2
}

windowrule {
    # Полноэкранным играм — ноль эффектов, чтобы iGPU не тратила кадры впустую
    name = games-no-effects
    match:fullscreen = true
    no_blur = true
    rounding = 0
    border_size = 0
}

#############################
### ПРАВИЛА ДЛЯ СЛОЁВ     ###
#############################

# Блочная форма — под переписанный в 0.5x движок правил.
# name обязан быть ПЕРВЫМ значением в блоке — иначе ошибка парсера.
layerrule {
    name = blur-waybar
    match:namespace = waybar
    blur = true
    ignore_alpha = 0.3
}

layerrule {
    name = blur-notifications
    match:namespace = notifications
    blur = true
    ignore_alpha = 0.3
    # без анимации: плашка EN/RU (тоже уведомление mako) появляется сразу, а не выплывает ~0.4 с
    no_anim = true
}

layerrule {
    name = blur-launcher
    match:namespace = launcher
    blur = true
    ignore_alpha = 0.3
}

# ЗАПАСНОЙ ВАРИАНТ. Если `hyprctl configerrors` ругнётся на блоки выше —
# закомментируй их и раскомментируй эти три строки (старый inline-синтаксис):
# layerrule = blur, waybar
# layerrule = blur, notifications
# layerrule = blur, launcher

###########################################
### ЛОКАЛЬНЫЕ ПЕРЕОПРЕДЕЛЕНИЯ            ###
###########################################
# Всё личное клади в local.conf — он не перезапишется при обновлении этого файла.
# Файл может не существовать, это не ошибка.
source = ~/.config/hypr/local.conf
