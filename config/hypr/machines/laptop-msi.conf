# machine.conf ноутбука MSI (Ubuntu 26.04, AMD 680M + RTX 4050) — для справки.
# Это вырезанные из hyprland.conf куски как есть.

# eDP-1: 1920x1080@144. Пути by-path стабильны между загрузками, в отличие от cardN.
# Acer — главный монитор, стоит СПРАВА от ноутбука (с 03.11.2026). Задан по модели (desc:),
# а не по разъёму — переживёт подключение в другой порт. Без Acer ноутбук просто один.
monitor = eDP-1, 1920x1080@144, 0x0, 1
monitor = desc:Acer Technologies RL242Y E 83457AC324708, 1920x1080@100, 1920x0, 1
monitor = , preferred, auto, auto          # любой внешний — автоматически

#############################
### ГИБРИДНАЯ ГРАФИКА     ###
#############################

# ГЛАВНОЕ. У Hyprland бэкенд Aquamarine, поэтому переменная AQ_DRM_DEVICES,
# а НЕ WLR_DRM_DEVICES (та только у wlroots/Sway и здесь молча ничего не сделает).
#
# ВНИМАНИЕ: список разделяется ДВОЕТОЧИЕМ, поэтому пути /dev/dri/by-path/...
# использовать НЕЛЬЗЯ — в них самих есть двоеточия (pci-0000:05:00.0-card),
# Aquamarine режет их на куски, не находит GPU и Hyprland падает на старте.
# Только /dev/dri/cardN. ПЕРВЫЙ в списке становится primary — им композитор рендерит.
# Порядок GPU выбирает ~/.local/bin/hypr-gpu-select (вызывается из ~/.profile перед стартом
# Hyprland) и пишет его в gpu.conf:
#   Acer (HDMI висит на NVIDIA) подключён при входе → NVIDIA первой, иначе кадры для него
#     копируются между GPU через CPU (Hyprland ел 75–95% ядра);
#   без внешнего монитора → AMD первой: встроенный экран на AMD, дискретка спит.
# Монитор, подключённый ПОСЛЕ входа, рендер не переключит — нужен перезаход.
source = ~/.config/hypr/gpu.conf

# АВАРИЙНЫЙ ВЫХОД. Если Hyprland не стартует — зайди в TTY (Ctrl+Alt+F2) и:
#   touch ~/.config/hypr/gpu-amd-only      — всегда рендер на AMD, как было раньше;
#   rm ~/.config/hypr/gpu.conf             — пусть Aquamarine выберет GPU сам.

# AQ_FORCE_LINEAR_BLIT,0 ОТКЛЮЧЕНО 20.10.2026: с ним NVIDIA не может принять кадр AMD напрямую
# («EGL (blit): Failed to create image from source buffer directly» + «DRM Dumb» в логе),
# и каждый кадр для монитора на HDMI (висит на NVIDIA) копируется через CPU —
# Hyprland ел 75–95% ядра с Acer и 7% без него. По умолчанию (linear) копирует GPU.
# Если на HDMI-мониторе появятся артефакты — вернуть строку ниже и перелогиниться.
# env = AQ_FORCE_LINEAR_BLIT,0

# Аппаратное декодирование видео — через AMD (Mesa), она же гонит картинку на экран
env = LIBVA_DRIVER_NAME,radeonsi
env = VDPAU_DRIVER,radeonsi
# GLX-вендор (__GLX_VENDOR_LIBRARY_NAME) задаёт gpu.conf — он должен совпадать с GPU Hyprland/Xwayland,
# см. ~/.local/bin/hypr-gpu-select. Запуск на дискретке при рендере на AMD — обёртка ~/.local/bin/nv.

env = XDG_MENU_PREFIX,plasma-

# Обзор рабочих столов (пакет hyprland-plugin-hyprexpo)
plugin = /usr/lib/x86_64-linux-gnu/hyprland/plugins/libhyprexpo.so

# Acer — главный: на нём столы 1–10 (Win+N через ~/.local/bin/hypr-ws).
# Без Acer эти столы сами переезжают на ноутбук.
workspace = 1, monitor:desc:Acer Technologies RL242Y E 83457AC324708, persistent:true, default:true
workspace = 2, monitor:desc:Acer Technologies RL242Y E 83457AC324708, persistent:true
workspace = 3, monitor:desc:Acer Technologies RL242Y E 83457AC324708, persistent:true
workspace = 4, monitor:desc:Acer Technologies RL242Y E 83457AC324708, persistent:true
workspace = 5, monitor:desc:Acer Technologies RL242Y E 83457AC324708, persistent:true
workspace = 6, monitor:desc:Acer Technologies RL242Y E 83457AC324708
workspace = 7, monitor:desc:Acer Technologies RL242Y E 83457AC324708
workspace = 8, monitor:desc:Acer Technologies RL242Y E 83457AC324708
workspace = 9, monitor:desc:Acer Technologies RL242Y E 83457AC324708
workspace = 10, monitor:desc:Acer Technologies RL242Y E 83457AC324708
# Ноутбук при подключённом Acer: один стол 11, не переключается (Win+N с него
# ведёт на столы Acer; лишние столы ноутбука сворачивает hypr-ws-compact, pin_laptop).
# Без Acer главный — ноутбук: окна стола 11 переезжают на столы 1–10 (hypr-ws-compact, laptop_main).
workspace = 11, monitor:eDP-1, default:true   # не persistent: без Acer он пустеет и пропадает (laptop_main)

# gpu.conf пишет ~/.local/bin/hypr-gpu-select (на ноутбуке, в набор не входит)
